<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../css/tokens.css"><style>
body{margin:0;width:1200px;height:520px;background:#ecece9;font-family:var(--font-body);color:#0d0d0d;display:grid;grid-template-columns:repeat(3,1fr)}
.c{display:grid;justify-items:center;align-content:start;gap:18px;padding:40px 0;border-right:1px solid rgb(13 13 13/.14)}.c:last-child{border:0}
.big{width:200px;height:200px}.row{display:flex;gap:16px;align-items:center}.dark{background:#0f0f10;padding:10px 14px;border-radius:10px;display:flex;gap:16px;align-items:center}
h2{margin:0;font:600 18px var(--font-body)}p{margin:0;font:12px var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:#55554f}
.nav{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-stretch:125%;font-weight:850;text-transform:uppercase}
</style></head><body>
<div class="c"><img class="big" src="logo-a-turn.svg"><h2>A · Turn (wybrane)</h2><div class="row"><img src="logo-a-turn.svg" width="16"><img src="logo-a-turn.svg" width="32"><img src="logo-a-turn.svg" width="48"><div class="dark"><img src="logo-a-turn.svg" width="16"><img src="logo-a-turn.svg" width="32"></div></div><div class="nav"><img src="logo-a-turn.svg" width="30">Hubert</div><p>H, który się obraca</p></div>
<div class="c"><img class="big" src="logo-b-bar.svg"><h2>B · Bar</h2><div class="row"><img src="logo-b-bar.svg" width="16"><img src="logo-b-bar.svg" width="32"><img src="logo-b-bar.svg" width="48"><div class="dark"><img src="logo-b-bar.svg" width="16"><img src="logo-b-bar.svg" width="32"></div></div><div class="nav"><img src="logo-b-bar.svg" width="30">Hubert</div><p>pomarańczowy pas z hero</p></div>
<div class="c"><img class="big" src="logo-c-hb.svg"><h2>C · Hb</h2><div class="row"><img src="logo-c-hb.svg" width="16"><img src="logo-c-hb.svg" width="32"><img src="logo-c-hb.svg" width="48"><div class="dark"><img src="logo-c-hb.svg" width="16"><img src="logo-c-hb.svg" width="32"></div></div><div class="nav"><img src="logo-c-hb.svg" width="30">Hubert</div><p>monogram Hubibi</p></div>
</body></html>
